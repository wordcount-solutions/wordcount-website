name: Publish production and staging

on:
  pull_request:
    branches: [main, production]
  push:
    # Publish direct website edits as well as PR merges; main stays unprotected.
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://wordcount-solutions.github.io/wordcount-website' }}
  DREAMHOST_URL: https://wordcount.solutions

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed change
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
          fallback: none
      - name: Check both URL layouts and assembly
        run: make test assemble verify-artifact
      - name: Check DreamHost URL layout and assembly
        run: make assemble verify-artifact SITE_URL="$DREAMHOST_URL" OUTPUT_DIR=.tmp/dreamhost

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Read branch heads only after the previous deployment has finished.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout staging and deployment tools
        uses: actions/checkout@v5
        with:
          ref: main
          path: staging-source
          submodules: recursive
          persist-credentials: false
      - name: Checkout production
        uses: actions/checkout@v5
        with:
          ref: production
          path: production-source
          submodules: recursive
          persist-credentials: false
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
          fallback: none
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test staging source
        run: make -C staging-source test
      - name: Build both branch snapshots
        run: >-
          make -C staging-source assemble
          PRODUCTION_SOURCE="$GITHUB_WORKSPACE/production-source"
          STAGING_SOURCE="$GITHUB_WORKSPACE/staging-source"
          OUTPUT_DIR="$RUNNER_TEMP/pages"
      - name: Verify assembled artifact
        run: make -C staging-source verify-artifact OUTPUT_DIR="$RUNNER_TEMP/pages"
      - name: Build DreamHost branch snapshots
        run: >-
          make -C staging-source assemble verify-artifact
          SITE_URL="$DREAMHOST_URL"
          PRODUCTION_SOURCE="$GITHUB_WORKSPACE/production-source"
          STAGING_SOURCE="$GITHUB_WORKSPACE/staging-source"
          OUTPUT_DIR="$RUNNER_TEMP/dreamhost"
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy combined site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Configure DreamHost SSH
        env:
          DREAMHOST_SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DREAMHOST_SSH_PRIVATE_KEY" || { echo 'Missing DREAMHOST_SSH_PRIVATE_KEY secret'; exit 1; }
          umask 077
          printf '%s\n' "$DREAMHOST_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/dreamhost_key"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/dreamhost_key" > /dev/null
      - name: Publish WordCount Solutions production and staging
        env:
          RSYNC_RSH: >-
            ssh -i ${{ runner.temp }}/dreamhost_key
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=${{ github.workspace }}/staging-source/scripts/dreamhost_known_hosts
            -o ConnectTimeout=20
        run: make -C staging-source sync-dreamhost OUTPUT_DIR="$RUNNER_TEMP/dreamhost"
      - name: Remove temporary DreamHost key
        if: always()
        run: rm -f "$RUNNER_TEMP/dreamhost_key"
