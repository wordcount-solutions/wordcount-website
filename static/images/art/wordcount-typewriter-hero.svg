<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Typewriter editorial hero</title>
  <desc id="desc">A blurred city backdrop with an antique typewriter and hand typing in warm sunlight.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f1dbba"/>
      <stop offset="35%" stop-color="#d7c7b7"/>
      <stop offset="100%" stop-color="#998d85"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f9f3d5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f9f3d5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" x2="1">
      <stop offset="0%" stop-color="#3b2a24"/>
      <stop offset="100%" stop-color="#1b1715"/>
    </linearGradient>
    <linearGradient id="typewriter" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#34291f"/>
      <stop offset="100%" stop-color="#1c1714"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1">
      <stop offset="0%" stop-color="#f9f6ed"/>
      <stop offset="100%" stop-color="#e7e1da"/>
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurMedium" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#sunGlow)"/>

  <g filter="url(#blurSoft)" opacity="0.6">
    <rect x="0" y="0" width="1200" height="420" fill="#ddd0c4"/>
    <ellipse cx="170" cy="140" rx="110" ry="110" fill="#dcd0c5"/>
    <ellipse cx="470" cy="130" rx="140" ry="120" fill="#d9d1c9"/>
    <ellipse cx="760" cy="150" rx="180" ry="130" fill="#d0c6bf"/>
    <ellipse cx="1030" cy="120" rx="120" ry="115" fill="#ddd0c5"/>
  </g>

  <g filter="url(#blurMedium)" opacity="0.75">
    <g fill="#1f1b1a">
      <ellipse cx="230" cy="470" rx="90" ry="250"/>
      <ellipse cx="420" cy="410" rx="110" ry="290"/>
      <ellipse cx="610" cy="430" rx="120" ry="300"/>
      <ellipse cx="840" cy="420" rx="118" ry="285"/>
      <ellipse cx="1010" cy="470" rx="94" ry="255"/>
      <rect x="172" y="330" width="82" height="205" rx="35"/>
      <rect x="384" y="292" width="90" height="240" rx="38"/>
      <rect x="570" y="295" width="98" height="245" rx="38"/>
      <rect x="774" y="315" width="104" height="250" rx="38"/>
      <rect x="955" y="360" width="90" height="200" rx="35"/>
    </g>
  </g>

  <g opacity="0.9">
    <path d="M120 1250 L1080 1250 L1080 1600 L120 1600 Z" fill="url(#table)"/>
    <path d="M220 1030 L980 1030 L1060 1250 L140 1250 Z" fill="#2f2724" opacity="0.9"/>
  </g>

  <g>
