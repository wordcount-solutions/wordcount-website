            <rect x="300" y="40" width="28" height="24" rx="12"/>
            <rect x="340" y="40" width="28" height="24" rx="12"/>
            <rect x="10" y="80" width="30" height="24" rx="12"/>
            <rect x="50" y="80" width="30" height="24" rx="12"/>
            <rect x="90" y="80" width="30" height="24" rx="12"/>
            <rect x="130" y="80" width="30" height="24" rx="12"/>
            <rect x="170" y="80" width="30" height="24" rx="12"/>
            <rect x="210" y="80" width="30" height="24" rx="12"/>
            <rect x="250" y="80" width="30" height="24" rx="12"/>
            <rect x="290" y="80" width="30" height="24" rx="12"/>
            <rect x="330" y="80" width="30" height="24" rx="12"/>
          </g>
        </g>
