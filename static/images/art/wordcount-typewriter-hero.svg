      <rect x="742" y="1166" width="96" height="12" rx="6" fill="#dfdfdf" opacity="0.9"/>
      <path d="M82 980 C170 1020, 190 1098, 236 1148 L187 1175 C160 1128, 140 1068, 82 1035 Z" fill="#d8b18d" opacity="0.83"/>
